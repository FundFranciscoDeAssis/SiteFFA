<main class="fotos-secao">
      <div class="fotos-card-busca">
        <h2>Busca por Reconhecimento Facial</h2>
        <p>
          Tire uma selfie ou envie uma foto do seu rosto para encontrar suas fotos na Colônia de Férias.
        </p>

        <label for="input-selfie" class="sobre-botao-saibamais" style="cursor: pointer; display: inline-block;">
          Tirar Selfie / Enviar Foto
        </label>
        <input type="file" id="input-selfie" accept="image/*" capture="user" style="display: none;" />

        <div id="status-busca" style="color: #ffffff; font-size: 1.1rem; margin-top: 20px; font-weight: 600;"></div>
      </div>

      <div id="galeria-resultados" class="fotos-grid"></div>
    </main>

    <!-- Script de Busca e Download via Proxy -->
    <script>
      const inputSelfie = document.getElementById('input-selfie');
      const statusBusca = document.getElementById('status-busca');
      const galeriaResultados = document.getElementById('galeria-resultados');

      function baixarFotoDireto(url, btnElement) {
        btnElement.innerText = 'Baixando...';
        btnElement.disabled = true;

        const downloadProxyUrl = `/api/search-face?fileUrl=${encodeURIComponent(url)}`;
        const a = document.createElement('a');
        a.href = downloadProxyUrl;
        a.download = `Foto_Colonia_${Date.now()}.jpg`;
        document.body.appendChild(a);
        a.click();
        a.remove();

        setTimeout(() => {
          btnElement.innerText = 'Baixar Foto Original';
          btnElement.disabled = false;
        }, 1500);
      }

      function renderizarFotos(photos) {
        galeriaResultados.innerHTML = '';
        statusBusca.innerText = `Encontramos ${photos.length} fotos com o seu rosto!`;

        photos.forEach((url) => {
          const card = document.createElement('div');
          card.className = 'fotos-item-card';

          const imgEl = document.createElement('img');
          imgEl.src = url;
          imgEl.alt = 'Foto encontrada';
          imgEl.loading = 'lazy';

          const btnDownload = document.createElement('button');
          btnDownload.className = 'btn-baixar-foto';
          btnDownload.innerText = 'Baixar Foto Original';

          btnDownload.addEventListener('click', () => {
            baixarFotoDireto(url, btnDownload);
          });

          card.appendChild(imgEl);
          card.appendChild(btnDownload);
          galeriaResultados.appendChild(card);
        });
      }

      window.addEventListener('DOMContentLoaded', () => {
        const fotosSalvas = sessionStorage.getItem('minhas_fotos_colonia');
        if (fotosSalvas) {
          try {
            const photos = JSON.parse(fotosSalvas);
            if (photos && photos.length > 0) {
              renderizarFotos(photos);
            }
          } catch (e) {
            sessionStorage.removeItem('minhas_fotos_colonia');
          }
        }
      });

      inputSelfie.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        statusBusca.innerText = 'Processando sua foto... Aguarde.';
        galeriaResultados.innerHTML = '';

        const img = new Image();
        img.src = URL.createObjectURL(file);

        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 1024;
          let width = img.width;
          let height = img.height;

          if (width > height && width > maxDim) {
            height *= maxDim / width;
            width = maxDim;
          } else if (height > maxDim) {
            width *= maxDim / height;
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const base64Image = canvas.toDataURL('image/jpeg', 0.8);
          statusBusca.innerText = 'Buscando fotos no servidor...';

          fetch('/api/search-face', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ imageBase64: base64Image }),
          })
          .then(res => res.json())
          .then(data => {
            if (data.photos && data.photos.length > 0) {
              sessionStorage.setItem('minhas_fotos_colonia', JSON.stringify(data.photos));
              renderizarFotos(data.photos);
            } else if (data.error) {
              statusBusca.innerText = `Erro: ${data.error}`;
            } else {
              statusBusca.innerText = 'Nenhuma foto encontrada para este rosto.';
            }
          })
          .catch(err => {
            console.error(err);
            statusBusca.innerText = 'Erro ao conectar com o servidor.';
          });
        };
      });
    </script>

<script>
  const inputSelfie = document.getElementById('input-selfie');
  const statusBusca = document.getElementById('status-busca');
  const galeriaResultados = document.getElementById('galeria-resultados');

  inputSelfie.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    statusBusca.innerText = 'Processando foto... Aguarde.';
    galeriaResultados.innerHTML = '';

    const img = new Image();
    img.src = URL.createObjectURL(file);

    img.onload = () => {
      // Redimensiona a foto para no máximo 1024px para envio leve e rápido
      const canvas = document.createElement('canvas');
      const maxDim = 1024;
      let width = img.width;
      let height = img.height;

      if (width > height && width > maxDim) {
        height *= maxDim / width;
        width = maxDim;
      } else if (height > maxDim) {
        width *= maxDim / height;
        height = maxDim;
      }

      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);

      const base64Image = canvas.toDataURL('image/jpeg', 0.8);
      statusBusca.innerText = 'Buscando fotos no servidor...';

      fetch('/api/search-face', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imageBase64: base64Image }),
      })
      .then(res => res.json())
      .then(data => {
        if (data.photos && data.photos.length > 0) {
          statusBusca.innerText = `Foram encontradas ${data.photos.length} fotos com o seu rosto.`;
          
          data.photos.forEach((url) => {
            const card = document.createElement('div');
            card.style.background = 'rgba(255, 255, 255, 0.05)';
            card.style.borderRadius = '8px';
            card.style.overflow = 'hidden';
            card.style.textAlign = 'center';
            card.style.padding = '10px';

            const imgEl = document.createElement('img');
            imgEl.src = url;
            imgEl.alt = 'Foto encontrada';
            imgEl.style.width = '100%';
            imgEl.style.height = '200px';
            imgEl.style.objectFit = 'cover';
            imgEl.style.borderRadius = '4px';

            const linkDownload = document.createElement('a');
            linkDownload.href = url;
            linkDownload.target = '_blank';
            linkDownload.download = '';
            linkDownload.innerText = 'Baixar Foto';
            linkDownload.className = 'sobre-botao-saibamais';
            linkDownload.style.display = 'inline-block';
            linkDownload.style.marginTop = '10px';
            linkDownload.style.fontSize = '0.9rem';

            card.appendChild(imgEl);
            card.appendChild(linkDownload);
            galeriaResultados.appendChild(card);
          });
        } else if (data.error) {
          statusBusca.innerText = `Erro: ${data.error}`;
        } else {
          statusBusca.innerText = 'Nenhuma foto encontrada para este rosto. Tente tirar outra foto com melhor iluminacao.';
        }
      })
      .catch(err => {
        console.error(err);
        statusBusca.innerText = 'Ocorreu um erro ao conectar com o servidor. Tente novamente.';
      });
    };
  });
</script>
